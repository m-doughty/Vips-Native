name: build-binaries

# Repackages upstream-prebuilt libvips into self-contained per-
# platform archives that Vips-Native's Build.rakumod can download
# at install time. We do NOT compile vips ourselves — the upstream
# sources (conda-forge for macOS and Linux, libvips/build-win64-mxe
# for Windows) are reputable and well-tested, and rebuilding vips's
# huge dep tree from source in CI would be a maintenance nightmare.
#
# Per platform:
#   1. Download libvips + transitive deps from the upstream source.
#   2. Cherry-pick the .dylib/.so/.dll files we need — libvips, its
#      dlopen'd loader modules (vips-modules-<M>.<m>/) and everything
#      either links; drop CLI binaries, headers, locales, docs, .a
#      archives. The macOS and Linux packs leave out conda-forge's
#      ImageMagick module, and everything only it links (Graphviz,
#      EPL-1.0, beside the packs' GPL code); Windows keeps ImageMagick.
#   3. Relocate inter-lib refs to @loader_path / $ORIGIN / sibling
#      DLLs so the bundle is self-contained and movable.
#   4. Write the notices kit — THIRD-PARTY.md (every bundled file ->
#      the package or component it came from, its version, licence and
#      source) and LICENSES/ (the licence texts) — beside the libraries;
#      fail on any library it cannot attribute, on a package left
#      without its licence text, and on copyleft the README does not
#      disclose (scripts/ci/third-party.py, scripts/ci/disclosed.json).
#      Repackage as vips-<platform>.{tar.gz,zip}.
#   5. macOS + Linux: stage the packaged archive the way Build.rakumod
#      does and run the loader probe (scripts/ci/probe-bundle.sh) —
#      every loader, the module ones included, must decode a real
#      file, with nothing loaded from outside the bundle. Windows: list
#      the packaged archive and fail unless the whole notices kit is in
#      it.
#   6. Publish to GitHub Releases under the BINARY_TAG.
#
# Triggers — the same release contract as Notcurses-Native:
#   * push of a `binaries-vips-*` tag: builds every platform and
#     publishes, but only if the tag equals BINARY_TAG (checked by
#     every build job and again by publish).
#   * workflow_dispatch: builds and probes every platform, and stops.
#     A dry run — never publishes, from any ref, so validating the
#     recipe can never overwrite the assets every installed dist
#     checksum-verifies against.
#   * branch pushes never run this workflow; test.yml and
#     old-distros.yml are the CI for those.

on:
  workflow_dispatch:
  push:
    tags:
      - 'binaries-vips-*'

jobs:
  # ---------------------------------------------------------------
  # macOS arm64 — conda-forge libvips package (macOS 11+)
  # ---------------------------------------------------------------
  build-macos:
    name: build-macos-arm64
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version + tag from BINARY_TAG
        id: vars
        shell: bash
        run: |
          set -euxo pipefail
          # head -n1 + tr handles both CRLF (Windows checkout) and
          # any accidental trailing whitespace.
          BINARY_TAG="$(head -n1 BINARY_TAG | tr -d '[:space:]')"
          if [[ -z "$BINARY_TAG" ]]; then
            echo "❌ BINARY_TAG empty / missing."
            ls -la BINARY_TAG || true
            exit 1
          fi
          # If triggered by tag push, sanity-check the pushed tag
          # matches the file. Stops a stale checkout from publishing
          # under the wrong tag.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            pushed="${GITHUB_REF#refs/tags/}"
            if [[ "$pushed" != "$BINARY_TAG" ]]; then
              echo "❌ Pushed tag '$pushed' doesn't match BINARY_TAG '$BINARY_TAG'."
              exit 1
            fi
          fi
          VIPS_VERSION="$(echo "$BINARY_TAG" | sed -E 's/^binaries-vips-(.+)-r[0-9]+$/\1/')"
          # Fail loud if the parse produced empty — better than letting
          # a downstream step try to download `vips-dev-w64-all-.zip`.
          if [[ -z "$VIPS_VERSION" || "$VIPS_VERSION" == "$BINARY_TAG" ]]; then
            echo "❌ Could not parse vips version from BINARY_TAG='$BINARY_TAG'."
            echo "   Expected format: binaries-vips-<version>-r<N>"
            exit 1
          fi
          echo "vips_version=$VIPS_VERSION" >> "$GITHUB_OUTPUT"
          echo "binary_tag=$BINARY_TAG"     >> "$GITHUB_OUTPUT"

      # Everything — fetching a pinned micromamba, creating the conda
      # prefix (libvips pinned by version AND build string), bundling
      # libvips + its loader modules + their dependency closure with
      # @loader_path relocation, the varargs shim and its export check,
      # ad-hoc signing, the arm64 / minos <= 11.0 / self-containment
      # audit, and the THIRD-PARTY.md + LICENSES/ notices kit — lives in
      # the script so it runs identically on a developer's Mac. No Homebrew: its vips bottle tracks only the
      # newest macOS (8.18.7 shipped for macOS 26 alone).
      - name: Stage + bundle (conda-forge libvips)
        env:
          VIPS_VERSION: ${{ steps.vars.outputs.vips_version }}
          BINARY_TAG: ${{ steps.vars.outputs.binary_tag }}
          WORK_DIR: ${{ runner.temp }}/vips-macos-arm64
        run: bash scripts/ci/bundle-macos-arm64.sh bundle

      - name: Package archive
        id: package
        run: |
          set -euxo pipefail
          artifact="vips-macos-arm64.tar.gz"
          tar -czf "$artifact" -C bundle .
          # macOS ships shasum (BSD) not sha256sum (GNU coreutils).
          shasum -a 256 "$artifact" | tee "${artifact}.sha256"
          mkdir -p artefacts
          mv "$artifact" "${artifact}.sha256" artefacts/

      - name: Probe the archive (every loader decodes; self-contained)
        run: bash scripts/ci/probe-bundle.sh artefacts/vips-macos-arm64.tar.gz "${{ steps.vars.outputs.binary_tag }}"

      - uses: actions/upload-artifact@v6
        with:
          name: vips-macos-arm64
          path: artefacts/
          retention-days: 14

  # ---------------------------------------------------------------
  # Linux — conda-forge libvips package, x86_64 + aarch64
  # ---------------------------------------------------------------
  build-linux:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # libvips-build: conda-forge's build string for the libvips
          # version in BINARY_TAG, pinned as the macOS lane pins its own
          # (scripts/ci/bundle-macos-arm64.sh). Bump with BINARY_TAG:
          #   micromamba search -c conda-forge --override-channels \
          #       --platform <conda-subdir> 'libvips==<version>'
          - os: ubuntu-22.04
            platform: linux-x86_64-glibc
            conda-subdir: linux-64
            libvips-build: he268db4_0
          - os: ubuntu-22.04-arm
            platform: linux-aarch64-glibc
            conda-subdir: linux-aarch64
            libvips-build: h4590af0_0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version + tag from BINARY_TAG
        id: vars
        shell: bash
        run: |
          set -euxo pipefail
          BINARY_TAG="$(head -n1 BINARY_TAG | tr -d '[:space:]')"
          if [[ -z "$BINARY_TAG" ]]; then
            echo "❌ BINARY_TAG empty / missing."
            ls -la BINARY_TAG || true
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            pushed="${GITHUB_REF#refs/tags/}"
            if [[ "$pushed" != "$BINARY_TAG" ]]; then
              echo "❌ Pushed tag '$pushed' doesn't match BINARY_TAG '$BINARY_TAG'."
              exit 1
            fi
          fi
          VIPS_VERSION="$(echo "$BINARY_TAG" | sed -E 's/^binaries-vips-(.+)-r[0-9]+$/\1/')"
          if [[ -z "$VIPS_VERSION" || "$VIPS_VERSION" == "$BINARY_TAG" ]]; then
            echo "❌ Could not parse vips version from BINARY_TAG='$BINARY_TAG'."
            echo "   Expected format: binaries-vips-<version>-r<N>"
            exit 1
          fi
          echo "vips_version=$VIPS_VERSION" >> "$GITHUB_OUTPUT"
          echo "binary_tag=$BINARY_TAG"     >> "$GITHUB_OUTPUT"

      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: false
          channels: conda-forge
          channel-priority: strict

      - name: Install patchelf
        run: sudo apt-get install -y --no-install-recommends patchelf

      - name: Fetch libvips from conda-forge
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          # libvips by version AND build string; ImageMagick's
          # imagemagick_* build rather than the agpl_* one the solver
          # prefers (identical libraries, different declared licence — see
          # scripts/ci/bundle-macos-arm64.sh). libvips depends on it, so
          # it is in the environment, though the bundle leaves it out.
          # The same specs go into the pack's THIRD-PARTY.md.
          # --override-channels: conda-forge and nothing else, whatever
          # channels the runner's condarc adds — the provenance the README
          # and THIRD-PARTY.md state, as the macOS lane's micromamba has it.
          SPECS="libvips=${{ steps.vars.outputs.vips_version }}=${{ matrix.libvips-build }} imagemagick=*=imagemagick_*"
          read -r -a specs <<<"$SPECS"
          conda create -y -n vipsenv --override-channels -c conda-forge "${specs[@]}"
          conda list -n vipsenv
          # conda env's lib dir is where libvips + glib + the
          # format libs all live, with their real filenames.
          ENV_LIB="$CONDA/envs/vipsenv/lib"
          echo "ENV_LIB=$ENV_LIB" >> "$GITHUB_ENV"
          echo "CONDA_SPECS=$SPECS" >> "$GITHUB_ENV"

      # libvips + its loader modules (lib/vips-modules-<M>.<m>/, less
      # ImageMagick's) + their dependency closure, $ORIGIN-relocated,
      # with the env's C++ runtime (newer than ubuntu-22.04's, and
      # required by libheif and poppler), the varargs shim, an audit
      # that every ELF file resolves inside the bundle or to the system
      # and that nothing of ImageMagick or Graphviz is in it, and the
      # THIRD-PARTY.md + LICENSES/ notices kit. See the script.
      - name: Stage + bundle
        shell: bash -el {0}
        env:
          BINARY_TAG: ${{ steps.vars.outputs.binary_tag }}
          PACK_NAME: vips-${{ matrix.platform }}.tar.gz
        run: bash scripts/ci/bundle-linux.sh "$ENV_LIB" bundle

      # Build installs the prebuilt on any glibc from its $MIN-GLIBC
      # (2.17, conda-forge's sysroot). A library needing newer would
      # load here and die on an older distribution, so it fails the lane.
      - name: Every library loads on Build's oldest glibc
        run: bash scripts/ci/check-glibc-floor.sh bundle Build.rakumod

      - name: Package archive
        run: |
          set -euxo pipefail
          artifact="vips-${{ matrix.platform }}.tar.gz"
          tar -czf "$artifact" -C bundle .
          sha256sum "$artifact" | tee "${artifact}.sha256"
          mkdir -p artefacts
          mv "$artifact" "${artifact}.sha256" artefacts/

      # Runs on the build image itself, so a library that needs a newer
      # glibc or C++ runtime than the runner's fails here. The older
      # glibc the prebuilts promise (Build's $MIN-GLIBC) is checked by
      # symbol version above, and run on Ubuntu 20.04 by old-distros.yml.
      - name: Probe the archive (every loader decodes; self-contained)
        run: bash scripts/ci/probe-bundle.sh "artefacts/vips-${{ matrix.platform }}.tar.gz" "${{ steps.vars.outputs.binary_tag }}"

      - uses: actions/upload-artifact@v6
        with:
          name: vips-${{ matrix.platform }}
          path: artefacts/
          retention-days: 14

  # ---------------------------------------------------------------
  # Windows x86_64 + arm64 — libvips/build-win64-mxe official prebuilt
  # ---------------------------------------------------------------
  build-windows:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            mxe-arch: x64
            msystem: UCRT64
            pkg-prefix: ucrt-x86_64
          - os: windows-11-arm
            platform: windows-arm64
            mxe-arch: arm64
            msystem: CLANGARM64
            pkg-prefix: clang-aarch64
    runs-on: ${{ matrix.os }}
    # ARM Windows runners can be flaky (cf. Notcurses-Native's
    # build-binaries.yml comments — ldd subprocesses occasionally
    # hang under xtajit64 emulation). Cap the job so a stuck runner
    # fails in an hour rather than burning the GitHub default 6h.
    timeout-minutes: 60
    # Python on Windows writes stdout in cp1252, which has no ✅ or ❌: the
    # kit and archive checks would die printing their verdicts.
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version + tag from BINARY_TAG
        id: vars
        shell: bash
        run: |
          set -euxo pipefail
          BINARY_TAG="$(head -n1 BINARY_TAG | tr -d '[:space:]')"
          if [[ -z "$BINARY_TAG" ]]; then
            echo "❌ BINARY_TAG empty / missing."
            ls -la BINARY_TAG || true
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            pushed="${GITHUB_REF#refs/tags/}"
            if [[ "$pushed" != "$BINARY_TAG" ]]; then
              echo "❌ Pushed tag '$pushed' doesn't match BINARY_TAG '$BINARY_TAG'."
              exit 1
            fi
          fi
          VIPS_VERSION="$(echo "$BINARY_TAG" | sed -E 's/^binaries-vips-(.+)-r[0-9]+$/\1/')"
          if [[ -z "$VIPS_VERSION" || "$VIPS_VERSION" == "$BINARY_TAG" ]]; then
            echo "❌ Could not parse vips version from BINARY_TAG='$BINARY_TAG'."
            echo "   Expected format: binaries-vips-<version>-r<N>"
            exit 1
          fi
          echo "vips_version=$VIPS_VERSION" >> "$GITHUB_OUTPUT"
          echo "binary_tag=$BINARY_TAG"     >> "$GITHUB_OUTPUT"

      - name: Fetch + extract build-win64-mxe prebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # build-win64-mxe asset naming:
          #   vips-dev-x64-all-<version>.zip      (Windows x86_64, all formats)
          #   vips-dev-arm64-all-<version>.zip    (Windows arm64,  all formats)
          # The "-all" variant carries heif/avif/openslide/etc; the
          # "-web" variants are stripped down. Tag scheme is v<version>.
          ZIP="vips-dev-${{ matrix.mxe-arch }}-all-${{ steps.vars.outputs.vips_version }}.zip"
          gh release download "v${{ steps.vars.outputs.vips_version }}" \
              --repo libvips/build-win64-mxe \
              --pattern "$ZIP" \
              --output "$ZIP"
          unzip -q "$ZIP"
          extract_dir=$(ls -d vips-dev-* | head -1)
          echo "EXTRACT_DIR=$extract_dir" >> "$GITHUB_ENV"

      - name: Stage DLLs
        run: |
          set -euxo pipefail
          mkdir -p bundle
          # Sibling-DLL search at runtime (enabled by FFI.rakumod
          # prepending the staged lib dir to PATH before LoadLibrary)
          # means we just copy every top-level DLL the upstream zip
          # ships — they're all designed to live in the same dir.
          # Skip the .exe / headers / pkgconfig.
          cp "$EXTRACT_DIR"/bin/*.dll bundle/

          # vips 8.15+ splits format loaders (pngload, jpegload,
          # heifload, webpsave, …) into separately-dlopen'd modules.
          # build-win64-mxe ships these under bin/vips-modules/; they
          # don't match the top-level *.dll glob above, so without
          # an explicit copy the bundle ships with a libvips that
          # can't open any image format.
          # Subdir name is versioned (e.g. vips-modules-8.18) — glob
          # it and let find pick the first match. Preserve that exact
          # name on copy so libvips's runtime module path
          # ($VIPSHOME/lib/vips-modules-<M>.<m>/; on Windows
          # FFI.rakumod sets VIPSHOME to the staged lib dir's parent)
          # finds our staged copy.
          WIN_MODULES_SRC=$(find "$EXTRACT_DIR/bin" -maxdepth 1 -type d \
              -name 'vips-modules-*' | head -n1)
          if [[ -n "$WIN_MODULES_SRC" ]]; then
              WIN_MODULES_BASENAME=$(basename "$WIN_MODULES_SRC")
              mkdir -p "bundle/$WIN_MODULES_BASENAME"
              cp "$WIN_MODULES_SRC"/*.dll "bundle/$WIN_MODULES_BASENAME"/
          else
              # Static-loader vips would make this a no-op, but
              # build-win64-mxe has used split modules since 8.15+;
              # a missing dir here means upstream has restructured
              # the zip. Halt rather than publishing an archive that
              # silently can't open any image format.
              echo "❌ No vips-modules-* subdir in build-win64-mxe zip."
              echo "   Upstream layout change? Inspect:"
              ls -la "$EXTRACT_DIR/bin"
              exit 1
          fi

          echo "--- bundle/ (top-level) ---"
          ls -la bundle/
          echo "(total top-level: $(find bundle -maxdepth 1 -type f | wc -l) files)"
          echo "--- bundle/$WIN_MODULES_BASENAME/ ---"
          ls -la "bundle/$WIN_MODULES_BASENAME/"
          echo "(total modules: $(find "bundle/$WIN_MODULES_BASENAME" -type f | wc -l) files)"
          # Explicit sanity check — the sibling-DLL path fix is useless
          # if the entry-point DLL itself isn't in the bundle.
          if [[ ! -f bundle/libvips-42.dll ]]; then
              echo "❌ libvips-42.dll not staged — top-level copy regression."
              exit 1
          fi

      # MinGW-w64 isn't pre-installed on windows-2022 anymore (it
      # used to ship at C:\msys64\, then got pruned to keep image
      # size down). Use msys2/setup-msys2 with cache to bring it
      # back — same pattern as Notcurses-Native's job. UCRT64 for
      # x86_64, CLANGARM64 for arm64 (matches Notcurses).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          # No `update: true` — that runs pacman -Syuu, shifts
          # installed versions on every run, and busts the cache
          # (which keys on installed package state). See
          # Notcurses-Native's build-binaries.yml for the full
          # rationale; same cache-friendliness story applies here.
          update: false
          cache: true
          install: >-
            mingw-w64-${{ matrix.pkg-prefix }}-toolchain

      - name: Compile varargs shim
        shell: 'msys2 {0}'
        run: |
          set -euxo pipefail
          # The Windows shim is required for `letterbox-to-buffer`
          # (and the underlying vips_flatten / vips_embed bindings),
          # which take a VipsArrayDouble* option that's awkward to
          # build from Raku without going through C. Without the
          # shim those bindings die at runtime with "requires the
          # libvips_shim".
          #
          # We link directly against the runtime DLLs in
          # $EXTRACT_DIR/bin via `-l:filename.dll`, instead of using
          # the conventional `-L lib -lvips`. Reason: build-win64-mxe
          # ships only MSVC-format `.lib` import libs in `lib/` (no
          # `.dll.a`). UCRT64's MinGW `ld` (binutils 2.36+) finds
          # `.lib` by `-l<name>` search; CLANGARM64's `lld` in GNU
          # mode doesn't, so r9 arm64 died with "lld: error: unable
          # to find library -lvips". `-l:filename` bypasses the
          # search algorithm and links against the named file
          # directly — clang/lld and GNU ld both accept it, and
          # both auto-derive imports from the DLL's export
          # directory. Same end result as linking against an import
          # lib, no upstream-shape or linker-version dependency.
          #
          # Use `cc` instead of `gcc`: UCRT64 ships gcc as primary
          # but CLANGARM64 ships clang (no gcc). Both environments
          # symlink `cc` to the default compiler, so a single
          # invocation covers both arches without conditional logic.

          echo "--- $EXTRACT_DIR/bin (runtime DLLs) ---"
          ls "$EXTRACT_DIR/bin" | head -30
          echo "--- $EXTRACT_DIR/lib (if present) ---"
          ls "$EXTRACT_DIR/lib" 2>/dev/null | head -30 || echo "(no lib dir — expected for arm64 builds)"

          cc -O2 -shared \
              -o bundle/libvips_shim.dll \
              src/vips_native_shim.c \
              -L"$EXTRACT_DIR/bin" \
              -l:libvips-42.dll \
              -l:libglib-2.0-0.dll

          # Verify our exports are in the DLL — guards against silent
          # link failure, and against a shim missing one function (the
          # binding for it would die with "Cannot locate symbol" in an
          # application, long after this job went green). Every
          # vips_shim_* the source defines -- each definition opens a
          # line, its return type on the line before -- must be among
          # the DLL's exports, checked by name. nm is in both UCRT64
          # (binutils) and CLANGARM64 (llvm-binutils-aliased); behaves
          # identically for our purposes.
          echo "--- libvips_shim.dll exports ---"
          nm -g --defined-only bundle/libvips_shim.dll \
              | sed -nE 's/.* T _?(vips_shim_[A-Za-z0-9_]+)$/\1/p' \
              | sort -u | tee shim-exports.txt
          grep -oE '^vips_shim_[A-Za-z0-9_]+' src/vips_native_shim.c \
              | sort -u > shim-defined.txt
          missing=$(comm -23 shim-defined.txt shim-exports.txt)
          if [ -n "$missing" ]; then
            echo "❌ libvips_shim.dll does not export: $missing"
            exit 1
          fi

          # The freshness sidecar Build.rakumod reads, as the macOS and
          # Linux jobs write it: the SHA-256 of the shim source this
          # DLL was compiled from. Without it an install cannot tell
          # this shim is current, and refreshes it from a compiler.
          sha256sum src/vips_native_shim.c | awk '{print $1}' \
            > bundle/libvips_shim.dll.srchash

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # THIRD-PARTY.md + LICENSES/: every DLL attributed to the
      # build-win64-mxe component that built it (fails on one it can't
      # be), and every component's licence, source and licence texts
      # from scripts/ci/license-texts/windows/manifest.json, each text
      # checked against its pinned SHA-256 (fails on a component the
      # manifest does not list for this architecture, a version that
      # disagrees with the release's versions.json, a text that does not
      # match, or copyleft scripts/ci/disclosed.json does not disclose).
      # See the script.
      - name: Third-party notices
        run: |
          set -euxo pipefail
          python scripts/ci/third-party.py mxe \
              --zip-root "$EXTRACT_DIR" \
              --zip-name "vips-dev-${{ matrix.mxe-arch }}-all-${{ steps.vars.outputs.vips_version }}.zip" \
              --release "v${{ steps.vars.outputs.vips_version }}" \
              --bundle bundle \
              --pack "vips-${{ matrix.platform }}.zip" \
              --tag "${{ steps.vars.outputs.binary_tag }}"

      - name: Package archive
        run: |
          set -euxo pipefail
          artifact="vips-${{ matrix.platform }}.zip"
          (cd bundle && 7z a "../$artifact" .)

          # The notices kit must be in the archive, whole — the macOS and
          # Linux lanes get this check from probe-bundle.sh: THIRD-PARTY.md,
          # the GPL-3.0 text and our own licence; a LICENSES/<component>/
          # directory for every component the licence-text manifest gives
          # texts for and THIRD-PARTY.md lists for this pack; and every
          # file the kit step wrote under LICENSES/ (~330 of them). 7z
          # prints the paths it stores with backslashes; compare them with
          # forward ones.
          7z l -slt "$artifact" | sed -n 's/^Path = //p' | tr '\134' '/' | sort -u > archive-paths.txt
          (cd bundle && find THIRD-PARTY.md LICENSES -type f) | sort -u > kit-paths.txt
          python - "${{ matrix.platform }}" <<'PY'
          import json, re, sys
          arch = sys.argv[1].split('-', 1)[1]
          archive = set(open('archive-paths.txt', encoding='utf-8').read().split('\n'))
          kit = [p for p in open('kit-paths.txt', encoding='utf-8').read().split('\n') if p]
          listed = set(re.findall(r'^\| ([A-Za-z0-9.+_-]+) \| ',
                                  open('bundle/THIRD-PARTY.md', encoding='utf-8').read(), re.M))
          manifest = json.load(open('scripts/ci/license-texts/windows/manifest.json',
                                    encoding='utf-8'))['components']
          dirs = sorted(k for k, c in manifest.items()
                        if c['files'] and arch in c['platforms'] and k in listed)
          problems = ['no %s' % p for p in ('THIRD-PARTY.md', 'LICENSES/GPL-3.0.txt',
                                            'LICENSES/Vips-Native/LICENSE') if p not in archive]
          problems += ['no LICENSES/%s/' % k for k in dirs
                       if not any(p.startswith('LICENSES/%s/' % k) for p in archive)]
          problems += ['no %s (the kit step wrote it)' % p for p in kit if p not in archive]
          written = set(p.split('/')[1] for p in kit if p.count('/') >= 2) & set(manifest)
          if not dirs or set(dirs) != written:
              problems.append('THIRD-PARTY.md lists components with texts %s, the kit step wrote %s'
                              % (sorted(set(dirs) - written), sorted(written - set(dirs))))
          if problems:
              print('❌ the archive is missing notices-kit entries:\n  ' + '\n  '.join(problems))
              sys.exit(1)
          print('✅ notices kit in the archive: %d files, %d component directories.' % (len(kit), len(dirs)))
          PY

          sha256sum "$artifact" | tee "${artifact}.sha256"
          mkdir -p artefacts
          mv "$artifact" "${artifact}.sha256" artefacts/

      - uses: actions/upload-artifact@v6
        with:
          name: vips-${{ matrix.platform }}
          path: artefacts/
          retention-days: 14

  # ---------------------------------------------------------------
  # Aggregate + publish release
  # ---------------------------------------------------------------
  publish:
    name: publish
    needs: [build-macos, build-linux, build-windows]
    # A pushed binaries-vips-* tag, and nothing else, publishes. A
    # workflow_dispatch builds and probes every platform and stops here —
    # even when dispatched on a tag ref, which `github.ref` alone would
    # not tell apart from a push — so "validate the recipe" and
    # "overwrite the archives every installed dist checksum-verifies
    # against" are never one click apart. Same gate as Notcurses-Native's
    # _release-publish.yml.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/binaries-vips-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag from BINARY_TAG (must equal the pushed tag)
        id: vars
        run: |
          set -euxo pipefail
          BINARY_TAG="$(tr -d '[:space:]' < BINARY_TAG)"
          [[ -z "$BINARY_TAG" ]] && { echo "❌ BINARY_TAG empty"; exit 1; }
          # The build jobs check this too; checked again here because
          # this is the step that names the release.
          pushed="${GITHUB_REF#refs/tags/}"
          if [[ "$pushed" != "$BINARY_TAG" ]]; then
            echo "❌ Pushed tag '$pushed' doesn't match BINARY_TAG '$BINARY_TAG'."
            exit 1
          fi
          echo "binary_tag=$BINARY_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Aggregate + checksum
        run: |
          set -euxo pipefail
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
              -exec cp {} release/ \;
          (cd release && sha256sum *.tar.gz *.zip 2>/dev/null) > release/checksums.txt
          ls -la release/
          cat release/checksums.txt

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          tag="${{ steps.vars.outputs.binary_tag }}"
          # Idempotent: edit if exists, else create.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
                --title "$tag" \
                --notes "Repackaged libvips prebuilts for Vips::Native. These archives redistribute third-party libraries, including GPL- and LGPL-licensed code; each one carries a THIRD-PARTY.md (every library file, the package it came from, its version, licence and source) and a LICENSES/ directory with the licence texts. See the Vips-Native README, \"Binary distributions and licensing\", and resources/checksums.txt in Vips-Native for the verified hashes."
          fi
